name: speech_to_text_service

services:
  speech-to-text-service:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    volumes:
      - ../:/app/
      - ../logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./.env
    ports:
      # - "127.0.0.1:8000:8000"
      - "8000:8000"
    depends_on:
      - redis
    networks:
      - service_network
    restart: unless-stopped

  worker:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    volumes:
      - ../:/app/
      - ../logs:/app/logs
    command: celery -A app.celery_worker.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - ./.env
    depends_on:
      - redis
    networks:
      - service_network
    restart: unless-stopped

  flower:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    command: celery -A app.celery_worker.celery_app flower --port=5555 --basic_auth=${FLOWER_BASIC_AUTH} --persistent=True --db=/data/flower.db
    env_file:
      - ./.env
    volumes:
      - flower_data:/data
    depends_on:
      - redis
      - worker
    ports:
      # - "127.0.0.1:5555:5555"
      - "5555:5555"
    networks:
      - service_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - service_network
    restart: unless-stopped

networks:
  service_network:
    driver: bridge
    name: shared_net

volumes:
  redis_data:
  flower_data:
