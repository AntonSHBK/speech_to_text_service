<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ASR Interface</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-2xl relative">
    <h1 class="text-2xl font-bold mb-6 text-center">ASR Транскрипция</h1>

    <div id="overlay" class="hidden absolute inset-0 bg-white/80 flex flex-col items-center justify-center rounded-2xl z-10">
      <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent"></div>
      <p class="mt-4 text-blue-600 font-medium">Идет обработка...</p>
      <p id="overlayProgress" class="mt-2 text-gray-700 text-sm">0%</p>
    </div>

    <form id="form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Аудиофайл</label>
        <input type="file" name="file" required class="w-full border rounded-lg p-2">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Модель</label>
          <select name="model" class="w-full border rounded-lg p-2">
            <option value="small" selected>small</option>
            <option value="medium">medium</option>
            <option value="large">large</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Язык</label>
          <select name="language" class="w-full border rounded-lg p-2">
            <option value="ru">ru</option>
            <option value="en">en</option>
            <option value="auto">auto</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Формат результата</label>
          <select name="result_format" class="w-full border rounded-lg p-2">
            <option value="docx">DOCX</option>
            <option value="txt">TXT</option>
            <option value="md">Markdown</option>
            <option value="pdf">PDF</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Beam size</label>
          <input type="number" name="beam_size" value="1" min="1" max="10" class="w-full border rounded-lg p-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Chunk length</label>
          <input type="number" name="chunk_length" value="20" min="5" max="60" class="w-full border rounded-lg p-2">
        </div>
      </div>

      <button id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl font-semibold">
        Транскрибировать
      </button>
    </form>

    <div class="mt-6">
      <label class="block text-sm font-medium mb-1">Результат</label>
      <textarea id="output" class="w-full h-40 border rounded-lg p-3" placeholder="Здесь появится текст транскрипции..."></textarea>
    </div>

    <button id="downloadBtn" class="hidden mt-4 w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-xl font-semibold">
      Сохранить результат
    </button>
  </div>

  <script>
    const form = document.getElementById("form");
    const overlay = document.getElementById("overlay");
    const output = document.getElementById("output");
    const submitBtn = document.getElementById("submitBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const overlayProgress = document.getElementById("overlayProgress");

    let lastResultFile = null;
    let lastDownloadUrl = null;
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    form.onsubmit = async (e) => {
      e.preventDefault();
      output.value = "";
      lastResultFile = null;
      lastDownloadUrl = null;
      downloadBtn.classList.add("hidden");
      overlay.classList.remove("hidden");
      overlayProgress.textContent = "0.0%";
      submitBtn.disabled = true;

      const data = new FormData();
      data.append("file", form.file.files[0]);
      const params = new URLSearchParams({
        model: form.model.value,
        language: form.language.value,
        beam_size: form.beam_size.value,
        chunk_length: form.chunk_length.value,
        result_format: form.result_format.value
      });

      try {
        const submitResponse = await fetch(`/transcribe/?${params.toString()}`, { method: "POST", body: data });
        if (!submitResponse.ok) throw new Error("Ошибка отправки запроса");
        const queued = await submitResponse.json();
        if (!queued.status_url) throw new Error("Не получен статус задачи");

        while (true) {
          const statusResponse = await fetch(queued.status_url, { method: "GET" });
          if (!statusResponse.ok) throw new Error("Ошибка проверки статуса");

          const statusData = await statusResponse.json();
          const status = statusData.status;
          const progress = typeof statusData.progress === "number" ? statusData.progress : 0.0;
          overlayProgress.textContent = `${progress.toFixed(1)}%`;

          if (status === "done") {
            overlayProgress.textContent = "100.0%";
            const result = statusData.result || {};
            output.value = result.text || "";
            lastResultFile = result.result_file || null;
            if (lastResultFile) {
              const fileName = lastResultFile.split("/").pop();
              lastDownloadUrl = `/transcribe/files/${encodeURIComponent(fileName)}`;
              downloadBtn.classList.remove("hidden");
            }
            break;
          }

          if (status === "failed") {
            output.value = `Ошибка: ${statusData.error || "unknown error"}`;
            break;
          }

          output.value = `Статус: ${status}...`;
          await sleep(1500);
        }
      } catch (err) {
        console.error(err);
        output.value = "Ошибка при обработке аудио";
      } finally {
        overlay.classList.add("hidden");
        submitBtn.disabled = false;
      }
    };

    downloadBtn.onclick = async () => {
      if (!lastResultFile || !lastDownloadUrl) return;

      try {
        const fileResponse = await fetch(lastDownloadUrl);
        if (!fileResponse.ok) throw new Error("download failed");
        const blob = await fileResponse.blob();

        const url = URL.createObjectURL(blob);
        const filename = lastResultFile.split("/").pop();

        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        output.value = `Файл сохранен на сервере: ${lastResultFile}`;
      }
    };
  </script>
</body>
</html>
